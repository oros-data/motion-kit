<!DOCTYPE html>
<html lang="{{LANG}}" data-composition-variables="[{&quot;id&quot;:&quot;debugSafe&quot;,&quot;type&quot;:&quot;boolean&quot;,&quot;label&quot;:&quot;Mostrar regiao segura do apresentador&quot;,&quot;default&quot;:false}]">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width={{WIDTH}}, height={{HEIGHT}}">
    <script src="lib/gsap.min.js"></script>
    <script src="lib/CustomEase.min.js"></script>
    <script src="data.js"></script>
    <script src="lib/kit.js"></script>
    <link rel="stylesheet" href="theme.css">
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: {{WIDTH}}px; height: {{HEIGHT}}px; overflow: hidden; background: var(--bg); }
      #root { position: relative; width: {{WIDTH}}px; height: {{HEIGHT}}px; overflow: hidden; background: var(--bg); }
      #stage { position: relative; width: 1920px; height: 1080px; overflow: hidden; color: var(--text); font-family: var(--font-display); background: radial-gradient(circle at 50% 40%, color-mix(in srgb, var(--surface) 55%, var(--bg)) 0%, var(--bg) 62%); zoom: {{ZOOM}}; }
      #grid { position: absolute; inset: -20px; background-image: linear-gradient(color-mix(in srgb, var(--primary) 7%, transparent) 1px, transparent 1px), linear-gradient(90deg, color-mix(in srgb, var(--primary) 7%, transparent) 1px, transparent 1px); background-size: 96px 96px; }
      #scan { position: absolute; inset: 0; pointer-events: none; background: repeating-linear-gradient(0deg, rgba(0,0,0,.18) 0, rgba(0,0,0,.18) 1px, transparent 1px, transparent 4px); mix-blend-mode: multiply; opacity: .42; }
      .mode-light #scan { display: none; }
      .hud { position: absolute; top: 38px; font-family: var(--font-mono); }
      #hud-left { left: 70px; font-size: 23px; color: var(--muted); letter-spacing: 3px; }
      #hud-right { right: 70px; font-size: 22px; color: var(--aside); letter-spacing: 2px; }
      #progress { position: absolute; left: 70px; right: 70px; bottom: 30px; height: 3px; background: color-mix(in srgb, var(--line) 60%, var(--bg)); }
      #progress-fill { width: 100%; height: 100%; background: var(--primary); box-shadow: 0 0 16px var(--primary); transform-origin: 0 50%; }
      .clip { position: absolute; inset: 0; }
      #safe-debug { position: absolute; left: 1492px; top: 830px; width: 356px; height: 200px; border: 4px dashed var(--danger); background: color-mix(in srgb, var(--danger) 18%, transparent); color: var(--danger); font: 700 26px var(--font-mono); display: none; align-items: center; justify-content: center; z-index: 50; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="{{TOTAL}}" data-width="{{WIDTH}}" data-height="{{HEIGHT}}" data-fps="{{FPS}}">
      <div id="stage" class="mode-{{MODE}}">
        <div id="grid" data-layout-allow-overflow></div>
        <div id="scan"></div>
        <div class="hud" id="hud-left">{{HUD_LEFT}}</div>
        <div class="hud" id="hud-right">{{HUD_RIGHT}}</div>
        <div id="progress"><div id="progress-fill"></div></div>
{{SLOTS}}
        <div id="safe-debug">REGIAO SEGURA · apresentador</div>
      </div>
      <audio id="silence" src="audio/silence.m4a" data-start="0" data-duration="{{AUDIO}}" data-track-index="20" data-volume="1"></audio>
    </div>
    <script>
      const total = window.KIT.total;
      const tl = gsap.timeline({ paused: true });
      for (let s = 0; s < total; s++) {
        tl.to("#grid", { x: Math.sin((s + 1) / 3) * 10, y: Math.sin((s + 1) / 3) * 5, duration: 1, ease: "none" }, s);
      }
      tl.fromTo("#progress-fill", { scaleX: 0 }, { scaleX: 1, duration: total, ease: "none" }, 0);
      if (window.__hyperframes.getVariables().debugSafe) document.getElementById("safe-debug").style.display = "flex";
      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
