<template>
  <style>
    /*__FONTS__*/
    [data-composition-id="__ID__"] { position: absolute; inset: 0; }
    [data-composition-id="__ID__"] .fx { position: absolute; inset: 0; padding: 150px 140px 110px; opacity: 0; }
    [data-composition-id="__ID__"] .kicker { font-family: var(--font-mono); font-size: 25px; color: var(--aside); letter-spacing: 4px; font-weight: 700; margin-bottom: 20px; }
    [data-composition-id="__ID__"] h2 { font-size: 68px; line-height: 1.08; font-weight: 800; color: var(--concept); max-width: 1400px; }
    [data-composition-id="__ID__"] .cards { display: flex; gap: 28px; margin-top: 64px; }
    [data-composition-id="__ID__"] .card { flex: 1; min-height: 300px; border: 2px solid var(--line); border-radius: 18px; padding: 34px; background: color-mix(in srgb, var(--surface) 85%, var(--bg)); opacity: 0; }
    [data-composition-id="__ID__"] .card .n { font-family: var(--font-mono); font-size: 27px; color: var(--aside); margin-bottom: 30px; }
    [data-composition-id="__ID__"] .card .t { font-size: 36px; line-height: 1.12; font-weight: 800; color: var(--text); }
    [data-composition-id="__ID__"] .card .b { font-size: 28px; line-height: 1.45; color: var(--text); margin-top: 24px; }
    [data-composition-id="__ID__"] .foot { font-size: 30px; color: var(--muted); margin-top: 42px; }
  </style>
  <div data-composition-id="__ID__" data-width="1920" data-height="1080">
    <div class="fx">
      <div class="kicker"></div>
      <h2></h2>
      <div class="cards"></div>
      <div class="foot"></div>
    </div>
    <script>
      (() => {
        const item = window.KIT.items["__ID__"];
        const p = item.props;
        const root = document.querySelector('[data-composition-id="__ID__"]');
        const $ = (s) => root.querySelector(s);
        $(".kicker").textContent = p.kicker || "";
        $("h2").textContent = p.headline || "";
        $(".foot").textContent = p.footer || "";
        const cards = (p.cards || []).map((card, i) => {
          const node = K.el("div", "card");
          const role = card.role || "concept";
          node.style.borderColor = `var(--${role})`;
          node.style.boxShadow = `inset 0 0 30px color-mix(in srgb, var(--${role}) 8%, transparent)`;
          node.append(K.el("div", "n", `${String(i + 1).padStart(2, "0")} //`), K.el("div", "t", card.title || ""));
          if (card.body) node.appendChild(K.el("div", "b", card.body));
          $(".cards").appendChild(node);
          return node;
        });
        const tl = gsap.timeline({ paused: true });
        K.fade(tl, $(".fx"), item.seconds, 18 / K.fps);
        const stagger = Math.min(1.2, (item.seconds - 3) / Math.max(1, cards.length));
        cards.forEach((card, i) => {
          tl.fromTo(card, { opacity: 0, y: 28 }, { opacity: 1, y: 0, duration: 25 / K.fps, ease: "power3.out", immediateRender: true }, 1.6 + i * stagger);
        });
        window.__timelines["__ID__"] = tl;
      })();
    </script>
  </div>
</template>
